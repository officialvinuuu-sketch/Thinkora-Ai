<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thinkora Offline Integration Test</title><style>body{font-family:Arial,sans-serif;background:#212121;color:#eee;max-width:720px;margin:0 auto;padding:24px}textarea,button{font:inherit}textarea{width:100%;min-height:110px;background:#2f2f2f;color:#fff;border:1px solid #555;border-radius:10px;padding:12px;box-sizing:border-box}button{margin-top:10px;padding:10px 16px;border:0;border-radius:9px;background:#fff;color:#111;font-weight:700}#status,#out{margin-top:16px;padding:12px;border:1px solid #444;border-radius:10px;background:#292929;white-space:pre-wrap}.ok{border-color:#667}.bad{border-color:#766}</style></head><body><h1>Thinkora AI — Offline Integration Test</h1><p>This page tests the new offline client only. The main Thinkora UI is not changed by this test.</p><div id="status">Checking local llama.cpp…</div><textarea id="input">Explain artificial intelligence in simple words.</textarea><br><button id="run">Test Offline AI</button><div id="out">No test run yet.</div><script src="/offline-client.js"></script><script>(async()=>{const s=document.getElementById('status'),o=document.getElementById('out'),b=document.getElementById('run'),i=document.getElementById('input');const ok=await ThinkoraOffline.isAvailable();s.textContent=ok?'Local llama.cpp: CONNECTED':'Local llama.cpp: NOT CONNECTED';s.className=ok?'ok':'bad';b.onclick=async()=>{b.disabled=true;o.textContent='Testing…';try{o.textContent=await ThinkoraOffline.chat(i.value)}catch(e){o.textContent='ERROR: '+e.message}finally{b.disabled=false}}})();</script></body></html>
