<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#212121"><title>Thinkora AI</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#212121;color:#ececec;font-family:Arial,Helvetica,sans-serif}button,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{height:100dvh;display:flex;overflow:hidden}.sidebar{width:270px;flex:0 0 270px;background:#171717;border-right:1px solid #303030;display:flex;flex-direction:column;padding:12px;z-index:30}.brand{display:flex;align-items:center;gap:9px;padding:8px 10px 18px;font-weight:700;font-size:20px}.brand-mark{font-size:25px}.new-chat{height:44px;border:1px solid #3d3d3d;border-radius:10px;background:#2b2b2b;color:#fff;text-align:left;padding:0 13px}.new-chat:hover,.history-item:hover,.side-action:hover{background:#343434}.section-title{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.6px;margin:18px 8px 8px}.history{flex:1;overflow:auto}.history-item{width:100%;border:0;border-radius:8px;background:transparent;color:#ddd;text-align:left;padding:10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}.history-item.active{background:#303030;color:#fff}.side-bottom{border-top:1px solid #303030;padding-top:10px}.side-action{width:100%;border:0;background:transparent;color:#aaa;text-align:left;border-radius:8px;padding:10px;font-size:13px}.credit{color:#666;font-size:10px;line-height:1.6;padding:12px 8px 3px}.main{min-width:0;flex:1;height:100%;display:flex;flex-direction:column}.topbar{height:60px;min-height:60px;border-bottom:1px solid #303030;background:#171717;display:flex;align-items:center;padding:0 16px;gap:10px}.menu-btn{display:none;width:40px;height:40px;border:1px solid #444;border-radius:9px;background:#2b2b2b;align-items:center;justify-content:center}.title{font-size:18px;font-weight:700}.subtitle{font-size:11px;color:#888}.chat{flex:1;overflow-y:auto;padding:28px 16px 170px}.chat-inner{max-width:850px;margin:0 auto}.welcome{text-align:center;margin:17vh auto 0;max-width:600px}.welcome h1{font-size:34px;margin:0 0 10px}.welcome p{color:#929292;margin:0}.message{display:flex;gap:13px;margin:0 0 28px;line-height:1.65;position:relative}.avatar{width:34px;height:34px;min-width:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#3d3d3d;font-weight:700}.user .avatar{background:#5a5a5a}.content{min-width:0;max-width:780px;word-break:break-word}.content p{margin:0 0 12px}.content p:last-child{margin-bottom:0}.content h1,.content h2,.content h3{margin:0 0 12px;line-height:1.3}.content h1{font-size:25px}.content h2{font-size:21px}.content h3{font-size:18px}.content ul,.content ol{margin:5px 0 12px;padding-left:24px}.content li{margin:4px 0}.content blockquote{border-left:3px solid #666;margin:10px 0;padding-left:14px;color:#aaa}.inline-code{font-family:monospace;background:#303030;border:1px solid #444;border-radius:5px;padding:2px 5px}.code-wrap{border:1px solid #444;border-radius:9px;overflow:hidden;background:#111;margin:12px 0}.code-head{height:35px;background:#292929;display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:#aaa;font-size:11px}.code-copy{border:1px solid #555;background:#353535;color:#eee;border-radius:6px;padding:5px 8px;font-size:11px}.code-wrap pre{margin:0;padding:13px;overflow:auto}.code-wrap code{font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}.response-actions{display:flex;align-items:center;gap:2px;margin-top:9px}.response-action{width:34px;height:32px;border:0;border-radius:8px;background:transparent;color:#aaa;display:flex;align-items:center;justify-content:center;padding:0}.response-action:hover,.response-action.active{background:#303030;color:#fff}.icon{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.more-wrap{position:relative}.more-menu{position:absolute;left:0;bottom:38px;width:205px;background:#2b2b2b;border:1px solid #484848;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.5);padding:5px;display:none;z-index:60}.more-menu.open{display:block}.more-item{width:100%;border:0;background:transparent;color:#eee;text-align:left;border-radius:7px;padding:10px;font-size:12px;display:flex;align-items:center;gap:10px}.more-item:hover{background:#3a3a3a}.more-item .icon{width:17px;height:17px}.user-actions{margin-top:5px}.composer-area{position:fixed;left:270px;right:0;bottom:0;padding:10px 16px 12px;background:linear-gradient(transparent,#212121 18%)}.composer{max-width:850px;margin:auto;position:relative}.attach-menu{position:absolute;bottom:64px;left:0;width:310px;background:#2b2b2b;border:1px solid #4a4a4a;border-radius:14px;box-shadow:0 15px 40px rgba(0,0,0,.45);padding:6px;display:none;z-index:50}.attach-menu.open{display:block}.attach-item{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#eee;text-align:left;border-radius:9px;padding:12px}.attach-item:hover{background:#383838}.attach-icon{width:34px;height:34px;border-radius:8px;background:#3a3a3a;display:flex;align-items:center;justify-content:center}.attach-text strong{display:block;font-size:14px}.attach-text span{display:block;color:#999;font-size:11px;margin-top:2px}.preview{display:none;max-width:260px;max-height:160px;border-radius:12px;border:1px solid #555;object-fit:contain;background:#111;margin:0 0 8px 6px}.preview.show{display:block}.attachment{display:none;align-items:center;gap:8px;background:#292929;border:1px solid #444;border-radius:9px;width:max-content;max-width:100%;padding:6px 9px;margin:0 0 7px 6px;color:#ccc;font-size:12px}.attachment.show{display:flex}.attachment button{border:0;background:transparent;color:#aaa;font-size:16px;padding:0}.input-shell{min-height:58px;border:1px solid #555;background:#2f2f2f;border-radius:17px;display:flex;align-items:flex-end;padding:7px;box-shadow:0 3px 15px rgba(0,0,0,.2)}.plus{width:42px;height:42px;min-width:42px;border:0;border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center}.plus:hover{background:#3a3a3a}.input{flex:1;resize:none;border:0;outline:0;background:transparent;color:#fff;min-height:42px;max-height:150px;padding:10px 8px;font-size:16px;line-height:1.4}.input::placeholder{color:#888}.send{width:42px;height:42px;border:0;border-radius:12px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center}.send:disabled{opacity:.45}.hint{text-align:center;color:#666;font-size:10px;margin-top:7px}.mobile-overlay{display:none}.hidden{display:none!important}@media(max-width:800px){.sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:.2s ease;box-shadow:10px 0 35px rgba(0,0,0,.4)}.sidebar.open{transform:translateX(0)}.mobile-overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}.menu-btn{display:flex}.topbar{padding:0 10px}.title{font-size:17px}.chat{padding:22px 13px 175px}.welcome{margin-top:18vh}.welcome h1{font-size:29px}.composer-area{left:0;padding:8px 10px 10px}.attach-menu{left:0;right:0;width:auto;bottom:62px}.content{max-width:calc(100vw - 65px)}.message{gap:10px}.avatar{width:32px;height:32px;min-width:32px}.hint{font-size:9px}.response-action{width:32px;height:31px}.more-menu{width:190px}}
</style></head><body>
<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><span class="brand-mark">✦</span><span>Thinkora AI</span></div><button class="new-chat" id="newChat">＋ New chat</button><div class="section-title">Chats</div><div class="history" id="history"></div><div class="side-bottom"><button class="side-action" id="clearChats">♻ Clear local chats</button><div class="credit">DEVELOPER: INNOCENT VINUU<br>© INNOCENT VINUU — Thinkora AI. All Rights Reserved.</div></div></aside><div class="mobile-overlay" id="overlay"></div>
<main class="main"><header class="topbar"><button class="menu-btn" id="menuBtn" aria-label="Open menu"><svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><span class="title">✦ Thinkora AI</span><span class="subtitle">AI Assistant</span></header><section class="chat" id="chat"><div class="chat-inner" id="chatInner"></div></section>
<div class="composer-area"><div class="composer"><div class="attach-menu" id="attachMenu"><button class="attach-item" id="fileOption"><span class="attach-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg></span><span class="attach-text"><strong>Upload file</strong><span>PDF, TXT, CSV, JSON, Markdown</span></span></button><button class="attach-item" id="photoOption"><span class="attach-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M4 7h4l2-2h4l2 2h4v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span><span class="attach-text"><strong>Take photo</strong><span>Use your camera</span></span></button><button class="attach-item" id="galleryOption"><span class="attach-icon"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 5-5 3 3 2-2 6 5"/></svg></span><span class="attach-text"><strong>Choose from gallery</strong><span>Analyze a photo</span></span></button></div><img class="preview" id="preview" alt="Selected image preview"><div class="attachment" id="attachment"><span id="attachmentName"></span><button id="removeAttachment">×</button></div><div class="input-shell"><button class="plus" id="plus" aria-label="Attach"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><textarea class="input" id="input" rows="1" placeholder="Message Thinkora AI..."></textarea><button class="send" id="send" aria-label="Send"><svg class="icon" viewBox="0 0 24 24"><path d="m5 12 14-7-4 14-3-6z"/><path d="m12 13 7-8"/></svg></button></div><div class="hint">Thinkora AI can make mistakes. Check important information.</div></div></div></main></div>
<input class="hidden" id="filePicker" type="file" accept=".pdf,.txt,.md,.csv,.json,application/pdf,text/plain,text/markdown,text/csv,application/json"><input class="hidden" id="cameraPicker" type="file" accept="image/*" capture="environment"><input class="hidden" id="galleryPicker" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
<script>
const $=id=>document.getElementById(id),chat=$('chat'),chatInner=$('chatInner'),input=$('input'),send=$('send'),plus=$('plus'),attachMenu=$('attachMenu'),filePicker=$('filePicker'),cameraPicker=$('cameraPicker'),galleryPicker=$('galleryPicker'),preview=$('preview'),attachment=$('attachment'),attachmentName=$('attachmentName');let chats=JSON.parse(localStorage.getItem('thinkoraChats')||'[]'),currentId=localStorage.getItem('thinkoraCurrentChat')||null,selectedImage=null,selectedDoc=null,docContext='',docName='';
const I={copy:'<svg class="icon" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/></svg>',edit:'<svg class="icon" viewBox="0 0 24 24"><path d="m4 20 4.5-1 9.8-9.8a2.1 2.1 0 0 0-3-3L5.5 16z"/><path d="m13.8 7.2 3 3"/></svg>',retry:'<svg class="icon" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0 1 4"/><path d="M20 5v6h-6"/></svg>',speak:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a5 5 0 0 1 0 6M18.5 6.5a9 9 0 0 1 0 11"/></svg>',share:'<svg class="icon" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 12v7h14v-7"/></svg>',report:'<svg class="icon" viewBox="0 0 24 24"><path d="M5 21V4h11l3 3v6H5"/><path d="M5 4h10v5H5"/></svg>',more:'<svg class="icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>',like:'<svg class="icon" viewBox="0 0 24 24"><path d="M7 10v10H4V10zM7 18h10.5a2 2 0 0 0 2-1.7l.8-5.5a2 2 0 0 0-2-2.3H14l.8-3.1A2 2 0 0 0 13 3l-4 7"/></svg>',dislike:'<svg class="icon" viewBox="0 0 24 24"><path d="M7 14V4H4v10zM7 6h10.5a2 2 0 0 1 2 1.7l.8 5.5a2 2 0 0 1-2 2H14l.8 3.1A2 2 0 0 1 13 21l-4-7"/></svg>'};
function save(){localStorage.setItem('thinkoraChats',JSON.stringify(chats));if(currentId)localStorage.setItem('thinkoraCurrentChat',currentId)}function current(){return chats.find(c=>c.id===currentId)||null}function ensureChat(t){let c=current();if(c)return c;c={id:String(Date.now()),title:t.slice(0,42)||'New chat',messages:[]};chats.push(c);currentId=c.id;save();return c}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code class="inline-code">$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>')}
function md(t){let out='',p=[];for(const l of String(t).replace(/\r/g,'').split('\n')){if(/^#{1,3}\s/.test(l)){if(p.length){out+='<p>'+inline(p.join('\n')).replace(/\n/g,'<br>')+'</p>';p=[]}let m=l.match(/^(#{1,3})\s+(.*)$/),n=m[1].length;out+='<h'+n+'>'+inline(m[2])+'</h'+n+'>'}else if(/^[-*]\s/.test(l)){if(p.length){out+='<p>'+inline(p.join('\n'))+'</p>';p=[]}out+='<ul><li>'+inline(l.replace(/^[-*]\s/,''))+'</li></ul>'}else if(/^\d+\.\s/.test(l)){if(p.length){out+='<p>'+inline(p.join('\n'))+'</p>';p=[]}out+='<ol><li>'+inline(l.replace(/^\d+\.\s/,''))+'</li></ol>'}else if(!l.trim()){if(p.length){out+='<p>'+inline(p.join('\n')).replace(/\n/g,'<br>')+'</p>';p=[]}}else p.push(l)}if(p.length)out+='<p>'+inline(p.join('\n')).replace(/\n/g,'<br>')+'</p>';return out}
function moreMenu(type,i){let items=type==='user'?[['edit','Edit']]:[['copy','Copy'],['edit','Edit'],['retry','Retry'],['speak','Read aloud'],['share','Share'],['report','Report']];return '<span class="more-wrap"><button class="response-action" data-action="more" data-index="'+i+'">'+I.more+'</button><span class="more-menu">'+items.map(x=>'<button class="more-item" data-more="'+x[0]+'" data-index="'+i+'">'+I[x[0]]+'<span>'+x[1]+'</span></button>').join('')+'</span></span>'}
function actions(i){return '<div class="response-actions"><button class="response-action" data-action="like" data-index="'+i+'">'+I.like+'</button><button class="response-action" data-action="dislike" data-index="'+i+'">'+I.dislike+'</button><button class="response-action" data-action="speak" data-index="'+i+'">'+I.speak+'</button><button class="response-action" data-action="share" data-index="'+i+'">'+I.share+'</button>'+moreMenu('assistant',i)+'</div>'}
function render(){chatInner.innerHTML='';let c=current();if(!c||!c.messages.length){chatInner.innerHTML='<div class="welcome"><h1>How can I help you?</h1><p>Ask Thinkora anything.</p></div>';renderHistory();return}c.messages.forEach((m,i)=>{let r=document.createElement('div');r.className='message '+m.role;let userActions=m.role==='user'?'<div class="response-actions user-actions">'+moreMenu('user',i)+'</div>':'';r.innerHTML='<div class="avatar">'+(m.role==='user'?'U':'T')+'</div><div class="content">'+(m.role==='assistant'?md(m.content):'<p>'+inline(m.content).replace(/\n/g,'<br>')+'</p>')+(m.role==='assistant'?actions(i):userActions)+'</div>';chatInner.appendChild(r)});chat.scrollTop=chat.scrollHeight;renderHistory()}
function renderHistory(){let h=$('history');h.innerHTML='';[...chats].reverse().forEach(c=>{let b=document.createElement('button');b.className='history-item'+(c.id===currentId?' active':'');b.textContent=c.title||'New chat';b.onclick=()=>{currentId=c.id;save();render();closeSidebar()};h.appendChild(b)})}function clearAtt(){selectedImage=null;selectedDoc=null;docContext='';docName='';preview.classList.remove('show');preview.removeAttribute('src');attachment.classList.remove('show');filePicker.value='';cameraPicker.value='';galleryPicker.value=''}function setImage(f){clearAtt();selectedImage=f;attachmentName.textContent=f.name;attachment.classList.add('show');preview.src=URL.createObjectURL(f);preview.classList.add('show');attachMenu.classList.remove('open')}async function readDoc(f){clearAtt();selectedDoc=f;attachmentName.textContent=f.name+' — reading…';attachment.classList.add('show');let fd=new FormData();fd.append('file',f);try{let r=await fetch('/api/files',{method:'POST',body:fd}),d=await r.json();if(!r.ok)throw Error(d.error||'Could not read file');docContext=d.text||'';docName=d.name||f.name;attachmentName.textContent=f.name+' — ready'}catch(e){attachmentName.textContent=e.message;selectedDoc=null}}
async function sendMessage(){let text=input.value.trim();if(!text&&!selectedImage&&!selectedDoc)return;let c=ensureChat(text||'Attached file'),shown=text||'Please analyze the attached file.';if(selectedImage)shown+='\n📷 '+selectedImage.name;if(selectedDoc)shown+='\n📎 '+selectedDoc.name;c.messages.push({role:'user',content:shown});input.value='';input.style.height='auto';let image=selectedImage,ctx=docContext,name=docName;clearAtt();render();send.disabled=true;try{let reply;if(image){let fd=new FormData();fd.append('image',image,image.name);fd.append('prompt',text||'Describe this image clearly and tell me the important details you can see.');let r=await fetch('/api/vision',{method:'POST',body:fd}),d=await r.json();if(!r.ok)throw Error(d.error||'Image analysis failed');reply=d.reply}else{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text||'Please analyze the attached file.',messages:c.messages.slice(0,-1),fileContext:ctx,fileName:name})}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');reply=d.reply}c.messages.push({role:'assistant',content:reply||'I could not generate a response.'})}catch(e){c.messages.push({role:'assistant',content:e.message||'Thinkora AI could not process your request right now.'})}finally{send.disabled=false;save();render()}}
function rowText(row){let x=row.querySelector('.content').cloneNode(true);x.querySelectorAll('.response-actions,.code-copy').forEach(e=>e.remove());return x.innerText.trim()}async function doAction(type,i){let c=current(),m=c?.messages[i];if(!m)return;if(type==='more'){let row=chatInner.querySelectorAll('.message')[i],menu=row.querySelector('.more-menu');document.querySelectorAll('.more-menu.open').forEach(x=>x.classList.remove('open'));menu.classList.toggle('open');return}if(type==='copy'){await navigator.clipboard?.writeText(m.content);return}if(type==='edit'){input.value=m.content.replace(/\n📷.*$/,'').replace(/\n📎.*$/,'');input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px';c.messages=c.messages.slice(0,i);save();render();input.focus();return}if(type==='like'||type==='dislike'){let row=chatInner.querySelectorAll('.message')[i],b=row.querySelector('[data-action="'+type+'"]'),other=row.querySelector('[data-action="'+(type==='like'?'dislike':'like')+'"]');b.classList.toggle('active');other.classList.remove('active');return}if(type==='speak'){if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(m.content))}return}if(type==='share'){if(navigator.share){try{await navigator.share({title:'Thinkora AI',text:m.content})}catch(_){}}else await navigator.clipboard?.writeText(m.content);return}if(type==='retry'&&m.role==='assistant'){let prev=c.messages[i-1];if(!prev)return;c.messages=c.messages.slice(0,i);save();render();input.value=prev.content;await sendMessage();return}if(type==='report')alert('Thanks. This response has been marked for review.')}
chatInner.addEventListener('click',e=>{let a=e.target.closest('[data-action]');if(a){doAction(a.dataset.action,Number(a.dataset.index));return}let b=e.target.closest('[data-more]');if(b){doAction(b.dataset.more,Number(b.dataset.index));document.querySelectorAll('.more-menu.open').forEach(x=>x.classList.remove('open'))}});document.addEventListener('click',e=>{if(!e.target.closest('.more-wrap'))document.querySelectorAll('.more-menu.open').forEach(x=>x.classList.remove('open'))});plus.onclick=()=>attachMenu.classList.toggle('open');$('fileOption').onclick=()=>filePicker.click();$('photoOption').onclick=()=>cameraPicker.click();$('galleryOption').onclick=()=>galleryPicker.click();$('removeAttachment').onclick=clearAtt;filePicker.onchange=e=>e.target.files[0]&&readDoc(e.target.files[0]);cameraPicker.onchange=e=>e.target.files[0]&&setImage(e.target.files[0]);galleryPicker.onchange=e=>e.target.files[0]&&setImage(e.target.files[0]);send.onclick=sendMessage;input.oninput=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};$('newChat').onclick=()=>{currentId=null;localStorage.removeItem('thinkoraCurrentChat');clearAtt();render();input.focus();closeSidebar()};$('clearChats').onclick=()=>{if(confirm('Clear all local chats?')){chats=[];currentId=null;localStorage.removeItem('thinkoraChats');localStorage.removeItem('thinkoraCurrentChat');render()}};$('menuBtn').onclick=()=>{$('sidebar').classList.add('open');$('overlay').classList.add('show')};$('overlay').onclick=closeSidebar;function closeSidebar(){$('sidebar').classList.remove('open');$('overlay').classList.remove('show')}render();
</script></body></html>
