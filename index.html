<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#212121">
<title>Thinkora AI</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#212121;color:#ececec;font-family:Arial,Helvetica,sans-serif}button,textarea{font:inherit}button{cursor:pointer}.app{height:100dvh;display:flex;overflow:hidden}.sidebar{width:270px;flex:0 0 270px;background:#171717;border-right:1px solid #303030;display:flex;flex-direction:column;padding:12px;z-index:30}.brand{display:flex;align-items:center;gap:9px;padding:8px 10px 18px;font-weight:700;font-size:20px}.brand-mark{font-size:25px}.new-chat{height:44px;border:1px solid #3d3d3d;border-radius:10px;background:#2b2b2b;color:#fff;text-align:left;padding:0 13px}.new-chat:hover,.history-item:hover,.side-action:hover{background:#343434}.section-title{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.6px;margin:18px 8px 8px}.history{flex:1;overflow:auto}.history-item{width:100%;border:0;border-radius:8px;background:transparent;color:#ddd;text-align:left;padding:10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}.history-item.active{background:#303030;color:#fff}.side-bottom{border-top:1px solid #303030;padding-top:10px}.side-action{width:100%;border:0;background:transparent;color:#aaa;text-align:left;border-radius:8px;padding:10px;font-size:13px}.credit{color:#666;font-size:10px;line-height:1.6;padding:12px 8px 3px}.main{min-width:0;flex:1;height:100%;display:flex;flex-direction:column}.topbar{height:60px;min-height:60px;border-bottom:1px solid #303030;background:#171717;display:flex;align-items:center;padding:0 16px;gap:10px}.menu-btn{display:none;width:40px;height:40px;border:1px solid #444;border-radius:9px;background:#2b2b2b;color:#fff;font-size:21px}.title{font-size:18px;font-weight:700}.subtitle{font-size:11px;color:#888}.chat{flex:1;overflow-y:auto;padding:28px 16px 170px}.chat-inner{max-width:850px;margin:0 auto}.welcome{text-align:center;margin:17vh auto 0;max-width:600px}.welcome h1{font-size:34px;margin:0 0 10px}.welcome p{color:#929292;margin:0}.message{display:flex;gap:13px;margin:0 0 28px;line-height:1.65}.avatar{width:34px;height:34px;min-width:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#3d3d3d;font-weight:700}.user .avatar{background:#5a5a5a}.content{min-width:0;max-width:780px;word-break:break-word}.content p{margin:0 0 12px}.content p:last-child{margin-bottom:0}.content h1,.content h2,.content h3{margin:0 0 12px;line-height:1.3}.content h1{font-size:25px}.content h2{font-size:21px}.content h3{font-size:18px}.content ul,.content ol{margin:5px 0 12px;padding-left:24px}.content li{margin:4px 0}.content blockquote{border-left:3px solid #666;margin:10px 0;padding-left:14px;color:#aaa}.inline-code{font-family:monospace;background:#303030;border:1px solid #444;border-radius:5px;padding:2px 5px}.code-wrap{border:1px solid #444;border-radius:9px;overflow:hidden;background:#111;margin:12px 0}.code-head{height:35px;background:#292929;display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:#aaa;font-size:11px}.copy{border:1px solid #555;background:#353535;color:#eee;border-radius:6px;padding:5px 8px;font-size:11px}.code-wrap pre{margin:0;padding:13px;overflow:auto}.code-wrap code{font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}.composer-area{position:fixed;left:270px;right:0;bottom:0;padding:10px 16px 12px;background:linear-gradient(transparent,#212121 18%)}.composer{max-width:850px;margin:auto;position:relative}.attach-menu{position:absolute;bottom:64px;left:0;width:310px;background:#2b2b2b;border:1px solid #4a4a4a;border-radius:14px;box-shadow:0 15px 40px rgba(0,0,0,.45);padding:6px;display:none;z-index:50}.attach-menu.open{display:block}.attach-item{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#eee;text-align:left;border-radius:9px;padding:12px}.attach-item:hover{background:#383838}.attach-icon{width:34px;height:34px;border-radius:8px;background:#3a3a3a;display:flex;align-items:center;justify-content:center;font-size:18px}.attach-text strong{display:block;font-size:14px}.attach-text span{display:block;color:#999;font-size:11px;margin-top:2px}.preview{display:none;max-width:260px;max-height:160px;border-radius:12px;border:1px solid #555;object-fit:contain;background:#111;margin:0 0 8px 6px}.preview.show{display:block}.attachment{display:none;align-items:center;gap:8px;background:#292929;border:1px solid #444;border-radius:9px;width:max-content;max-width:100%;padding:6px 9px;margin:0 0 7px 6px;color:#ccc;font-size:12px}.attachment.show{display:flex}.attachment button{border:0;background:transparent;color:#aaa;font-size:16px;padding:0}.input-shell{min-height:58px;border:1px solid #555;background:#2f2f2f;border-radius:17px;display:flex;align-items:flex-end;padding:7px;box-shadow:0 3px 15px rgba(0,0,0,.2)}.plus{width:42px;height:42px;min-width:42px;border:0;border-radius:12px;background:transparent;color:#eee;font-size:27px;display:flex;align-items:center;justify-content:center}.plus:hover{background:#3a3a3a}.input{flex:1;resize:none;border:0;outline:0;background:transparent;color:#fff;min-height:42px;max-height:150px;padding:10px 8px;font-size:16px;line-height:1.4}.input::placeholder{color:#888}.send{width:42px;height:42px;border:0;border-radius:12px;background:#fff;color:#111;font-size:20px}.send:disabled{opacity:.45}.hint{text-align:center;color:#666;font-size:10px;margin-top:7px}.mobile-overlay{display:none}.hidden{display:none!important}@media(max-width:800px){.sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:.2s ease;box-shadow:10px 0 35px rgba(0,0,0,.4)}.sidebar.open{transform:translateX(0)}.mobile-overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}.menu-btn{display:block}.topbar{padding:0 10px}.title{font-size:17px}.chat{padding:22px 13px 175px}.welcome{margin-top:18vh}.welcome h1{font-size:29px}.composer-area{left:0;padding:8px 10px 10px}.attach-menu{left:0;right:0;width:auto;bottom:62px}.content{max-width:calc(100vw - 65px)}.message{gap:10px}.avatar{width:32px;height:32px;min-width:32px}.hint{font-size:9px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><span class="brand-mark">✦</span><span>Thinkora AI</span></div>
  <button class="new-chat" id="newChat">＋ New chat</button>
  <div class="section-title">Chats</div>
  <div class="history" id="history"></div>
  <div class="side-bottom">
    <button class="side-action" id="clearChats">♻ Clear local chats</button>
    <div class="credit">DEVELOPER: INNOCENT VINUU<br>© INNOCENT VINUU — Thinkora AI. All Rights Reserved.</div>
  </div>
</aside>
<div class="mobile-overlay" id="overlay"></div>
<main class="main">
  <header class="topbar"><button class="menu-btn" id="menuBtn">☰</button><span class="title">✦ Thinkora AI</span><span class="subtitle">AI Assistant</span></header>
  <section class="chat" id="chat"><div class="chat-inner" id="chatInner"></div></section>
  <div class="composer-area">
    <div class="composer">
      <div class="attach-menu" id="attachMenu">
        <button class="attach-item" id="fileOption"><span class="attach-icon">📄</span><span class="attach-text"><strong>Upload file</strong><span>PDF, TXT, CSV, JSON, Markdown</span></span></button>
        <button class="attach-item" id="photoOption"><span class="attach-icon">📷</span><span class="attach-text"><strong>Take photo</strong><span>Use your camera</span></span></button>
        <button class="attach-item" id="galleryOption"><span class="attach-icon">🖼️</span><span class="attach-text"><strong>Choose from gallery</strong><span>Analyze a photo</span></span></button>
      </div>
      <img class="preview" id="preview" alt="Selected image preview">
      <div class="attachment" id="attachment"><span id="attachmentName"></span><button id="removeAttachment">×</button></div>
      <div class="input-shell">
        <button class="plus" id="plus" aria-label="Attach">＋</button>
        <textarea class="input" id="input" rows="1" placeholder="Message Thinkora AI..."></textarea>
        <button class="send" id="send" aria-label="Send">↑</button>
      </div>
      <div class="hint">Thinkora AI can make mistakes. Check important information.</div>
    </div>
  </div>
</main>
</div>
<input class="hidden" id="filePicker" type="file" accept=".pdf,.txt,.md,.csv,.json,application/pdf,text/plain,text/markdown,text/csv,application/json">
<input class="hidden" id="cameraPicker" type="file" accept="image/*" capture="environment">
<input class="hidden" id="galleryPicker" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
<script>
const $=id=>document.getElementById(id);
const chat=$('chat'),chatInner=$('chatInner'),input=$('input'),send=$('send'),plus=$('plus'),attachMenu=$('attachMenu'),filePicker=$('filePicker'),cameraPicker=$('cameraPicker'),galleryPicker=$('galleryPicker'),preview=$('preview'),attachment=$('attachment'),attachmentName=$('attachmentName');
let chats=JSON.parse(localStorage.getItem('thinkoraChats')||'[]');let currentId=localStorage.getItem('thinkoraCurrentChat')||null;let selectedImage=null;let selectedDoc=null;let docContext='';let docName='';
function save(){localStorage.setItem('thinkoraChats',JSON.stringify(chats));if(currentId)localStorage.setItem('thinkoraCurrentChat',currentId)}
function current(){return chats.find(c=>c.id===currentId)||null}
function ensureChat(title){let c=current();if(c)return c;c={id:String(Date.now()),title:title.slice(0,42)||'New chat',messages:[]};chats.push(c);currentId=c.id;save();renderHistory();return c}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function inline(s){let x=escapeHtml(s);x=x.replace(/`([^`]+)`/g,'<code class="inline-code">$1</code>');x=x.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');x=x.replace(/\*([^*]+)\*/g,'<em>$1</em>');x=x.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');return x}
function markdown(text){const lines=text.replace(/\r/g,'').split('\n');let html='',para=[],list=null,code=false,codeLang='',codeLines=[];function flush(){if(para.length){html+='<p>'+inline(para.join('\n')).replace(/\n/g,'<br>')+'</p>';para=[]}}function flist(){if(list){html+=list==='ul'?'</ul>':'</ol>';list=null}}function fcode(){html+='<div class="code-wrap"><div class="code-head"><span>'+escapeHtml(codeLang||'code')+'</span><button class="copy" data-copy="'+encodeURIComponent(codeLines.join('\n'))+'">Copy</button></div><pre><code>'+escapeHtml(codeLines.join('\n'))+'</code></pre></div>';codeLines=[];codeLang=''}for(const line of lines){if(line.trim().startsWith('```')){if(code){fcode();code=false}else{flush();flist();code=true;codeLang=line.trim().slice(3).trim()}continue}if(code){codeLines.push(line);continue}if(/^#{1,3}\s+/.test(line)){flush();flist();const m=line.match(/^(#{1,3})\s+(.*)$/);const n=m[1].length;html+='<h'+n+'>'+inline(m[2])+'</h'+n+'>';continue}if(/^[-*]\s+/.test(line)){flush();if(list!=='ul'){flist();html+='<ul>';list='ul'}html+='<li>'+inline(line.replace(/^[-*]\s+/,''))+'</li>';continue}if(/^\d+\.\s+/.test(line)){flush();if(list!=='ol'){flist();html+='<ol>';list='ol'}html+='<li>'+inline(line.replace(/^\d+\.\s+/,''))+'</li>';continue}if(/^>\s?/.test(line)){flush();flist();html+='<blockquote>'+inline(line.replace(/^>\s?/,''))+'</blockquote>';continue}if(!line.trim()){flush();flist();continue}para.push(line)}if(code){fcode()}flush();flist();return html}
function addMessage(role,text,extra=''){const welcome=$('welcome');if(welcome)welcome.remove();const row=document.createElement('div');row.className='message '+role;const av=document.createElement('div');av.className='avatar';av.textContent=role==='user'?'U':'T';const c=document.createElement('div');c.className='content';if(role==='assistant')c.innerHTML=markdown(text);else c.textContent=text;if(extra)c.insertAdjacentHTML('beforeend',extra);row.append(av,c);chatInner.appendChild(row);chat.scrollTop=chat.scrollHeight;return c}
function renderHistory(){const h=$('history');h.innerHTML='';[...chats].reverse().forEach(c=>{const b=document.createElement('button');b.className='history-item'+(c.id===currentId?' active':'');b.textContent=c.title||'New chat';b.onclick=()=>loadChat(c.id);h.appendChild(b)})}
function resetUI(){chatInner.innerHTML='<div class="welcome" id="welcome"><h1>How can I help you?</h1><p>Ask Thinkora anything.</p></div>'}
function loadChat(id){const c=chats.find(x=>x.id===id);if(!c)return;currentId=id;save();resetUI();c.messages.forEach(m=>addMessage(m.role,m.content));renderHistory();closeSidebar()}
function newChat(){currentId=null;localStorage.removeItem('thinkoraCurrentChat');resetUI();renderHistory();input.focus();closeSidebar()}
function setAttachment(name){attachmentName.textContent=name;attachment.classList.add('show')}
function clearAttachment(){selectedImage=null;selectedDoc=null;docContext='';docName='';attachment.classList.remove('show');preview.classList.remove('show');preview.removeAttribute('src');filePicker.value='';cameraPicker.value='';galleryPicker.value=''}
function closeMenu(){attachMenu.classList.remove('open');plus.textContent='＋'}
plus.onclick=()=>{const open=attachMenu.classList.toggle('open');plus.textContent=open?'×':'＋'};
$('fileOption').onclick=()=>{closeMenu();filePicker.click()};$('photoOption').onclick=()=>{closeMenu();cameraPicker.click()};$('galleryOption').onclick=()=>{closeMenu();galleryPicker.click()};$('removeAttachment').onclick=clearAttachment;
async function readDoc(file){clearAttachment();selectedDoc=file;setAttachment(file.name);const form=new FormData();form.append('file',file);attachmentName.textContent=file.name+' — reading…';try{const r=await fetch('/api/files',{method:'POST',body:form});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not read file');docContext=d.text||'';docName=d.name||file.name;attachmentName.textContent=file.name+' — ready'}catch(e){attachmentName.textContent=e.message;selectedDoc=null}}
function chooseImage(file){clearAttachment();if(!file||!file.type.startsWith('image/'))return;if(file.size>20*1024*1024){setAttachment('Image must be 20 MB or smaller');return}selectedImage=file;setAttachment(file.name);preview.src=URL.createObjectURL(file);preview.classList.add('show')}
filePicker.onchange=e=>{const f=e.target.files?.[0];if(f)readDoc(f)};cameraPicker.onchange=e=>chooseImage(e.target.files?.[0]);galleryPicker.onchange=e=>chooseImage(e.target.files?.[0]);
function setLoading(v){send.disabled=v;send.textContent=v?'…':'↑'}
async function sendMessage(){const text=input.value.trim();if(!text&&!selectedImage&&!selectedDoc)return;const c=ensureChat(text||'Attached file');let shown=text||'Please analyze the attached file.';if(selectedImage)shown+='\n📷 '+selectedImage.name;if(selectedDoc)shown+='\n📎 '+selectedDoc.name;addMessage('user',shown);input.value='';input.style.height='auto';closeMenu();const assistant=addMessage('assistant',selectedImage?'Analyzing image…':'Thinking…');const image=selectedImage;const doc=selectedDoc;const context=docContext;const name=docName;clearAttachment();setLoading(true);try{let reply='';if(image){const form=new FormData();form.append('image',image,image.name);form.append('prompt',text||'Describe this image in detail and tell me the important things visible in it.');const r=await fetch('/api/vision',{method:'POST',body:form});const d=await r.json();if(!r.ok)throw new Error(d.error||'Image analysis failed');reply=d.reply}else{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text||'Please analyze the attached file.',messages:c.messages,fileContext:context,fileName:name})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');reply=d.reply}assistant.innerHTML=markdown(reply);c.messages.push({role:'user',content:shown});c.messages.push({role:'assistant',content:reply});save();renderHistory()}catch(e){assistant.textContent=e.message||'Unable to connect to Thinkora AI.'}finally{setLoading(false)}}
send.onclick=sendMessage;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'});chatInner.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(!b)return;navigator.clipboard?.writeText(decodeURIComponent(b.dataset.copy));b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200)});
$('newChat').onclick=newChat;$('clearChats').onclick=()=>{if(confirm('Clear all local chats?')){chats=[];currentId=null;localStorage.removeItem('thinkoraChats');localStorage.removeItem('thinkoraCurrentChat');resetUI();renderHistory()}};
$('menuBtn').onclick=()=>{ $('sidebar').classList.add('open');$('overlay').classList.add('show')};$('overlay').onclick=()=>closeSidebar();function closeSidebar(){$('sidebar').classList.remove('open');$('overlay').classList.remove('show')}
renderHistory();if(currentId&&current())loadChat(currentId);else resetUI();
</script>
</body>
</html>
