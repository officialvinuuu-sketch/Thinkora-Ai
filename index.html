<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thinkora AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #212121;
      color: white;
      height: 100vh;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid #3a3a3a;
      background: #171717;
      font-size: 20px;
      font-weight: bold;
    }

    .logo {
      margin-right: 10px;
    }

    .badge {
      font-size: 11px;
      color: #aaa;
      font-weight: normal;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px 15%;
    }

    .welcome {
      text-align: center;
      margin-top: 20vh;
    }

    .welcome h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #999;
    }

    .message {
      display: flex;
      gap: 14px;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .avatar {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 50%;
      background: #444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .user .avatar {
      background: #666;
    }

    .content {
      max-width: 800px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .input-area {
      padding: 12px 15px;
      background: #212121;
    }

    .input-box {
      max-width: 850px;
      margin: auto;
      display: flex;
      align-items: flex-end;
      background: #2f2f2f;
      border: 1px solid #555;
      border-radius: 15px;
      padding: 7px;
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      padding: 12px;
      font-size: 16px;
      max-height: 150px;
    }

    button {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-size: 20px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }

    .credit {
      text-align: center;
      color: #777;
      font-size: 11px;
      padding: 8px;
    }

    @media (max-width: 700px) {
      .chat {
        padding: 20px 15px;
      }

      .welcome h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <span class="logo">✦ Thinkora AI</span>
    <span class="badge">AI Assistant</span>
  </header>

  <main class="chat" id="chat">

    <div class="welcome" id="welcome">
      <h1>How can I help you?</h1>
      <p>Ask Thinkora anything.</p>
    </div>

  </main>

  <div class="input-area">

    <div class="input-box">

      <textarea
        id="messageInput"
        rows="1"
        placeholder="Message Thinkora AI..."
      ></textarea>

      <button onclick="sendMessage()">↑</button>

    </div>

    <div class="credit">
      Developer: INNOCENT VINUU • © INNOCENT VINUU
Thinkora AI. All Rights Reserved.
    </div>

  </div>

</div>

<script>

const input = document.getElementById("messageInput");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");

input.addEventListener("keydown", function(event) {

  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }

});

function addMessage(type, text) {

  welcome.style.display = "none";

  const message = document.createElement("div");

  message.className = "message " + type;

  const avatar = document.createElement("div");

  avatar.className = "avatar";

  avatar.textContent =
    type === "user" ? "U" : "T";

  const content = document.createElement("div");

  content.className = "content";

  content.textContent = text;

  message.appendChild(avatar);
  message.appendChild(content);

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
  const text = input.value.trim();

  if (!text) return;

  addMessage("user", text);
  input.value = "";

  addMessage("assistant", "Thinking...");

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    const messages = chat.querySelectorAll(".message");
    const lastMessage = messages[messages.length - 1];

    if (lastMessage) {
      const content = lastMessage.querySelector(".content");
      if (content) {
        content.textContent =
          data.reply || data.error || "Something went wrong.";
      }
    }
  } catch (error) {
    const messages = chat.querySelectorAll(".message");
    const lastMessage = messages[messages.length - 1];

    if (lastMessage) {
      const content = lastMessage.querySelector(".content");
      if (content) {
        content.textContent = "Unable to connect to Thinkora AI server.";
      }
    }
  }
}

</script>

</body>
</html>
